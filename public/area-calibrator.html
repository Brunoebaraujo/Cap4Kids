<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area Calibrator</title><style>body{margin:0;display:grid;grid-template-columns:1fr 380px;background:#10180f;color:#ffe8a8;font-family:system-ui,sans-serif}main{overflow:auto;padding:16px}.stage{position:relative;width:1448px;height:1086px}img,canvas{position:absolute;inset:0;width:1448px;height:1086px}img{pointer-events:none}canvas{cursor:crosshair}aside{padding:14px;background:#241b14;max-height:100vh;overflow:auto;border-left:2px solid #6d4a2c}button,select{min-height:34px;background:#50371f;color:#ffe6a3;border:1px solid #a77a44}textarea{width:100%;min-height:360px;background:#100c08;color:#dfffd7;border:1px solid #6d4a2c;font:12px monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.hint{background:#151f12;border:1px solid #44552a;padding:8px;color:#d6c08b}</style></head><body><main><div class="stage"><img src="./assets/world/farm-world-large.png"><canvas id="c" width="1448" height="1086"></canvas></div></main><aside><h1>Area Calibrator</h1><p class="hint">Arraste pontos azuis. Arraste círculo magenta para workPoint. Shift+clique adiciona ponto. Delete remove ponto selecionado.</p><select id="sel"></select><div class="grid"><button id="copy">Copiar JSON</button><button id="reset">Restaurar</button><button id="add">Adicionar ponto</button><button id="grid">Grid 6x6</button></div><p id="status"></p><textarea id="out"></textarea></aside><script>const W=1448,H=1086;const defaults=[{"id":"field-1","type":"fieldBlock","label":"Campo 1","grid":{"rows":6,"cols":6},"polygon":[{"x":0.0373,"y":0.3444},{"x":0.1906,"y":0.2983},{"x":0.3191,"y":0.3867},{"x":0.1782,"y":0.477},{"x":0.0207,"y":0.418}],"workPoint":{"x":0.1692,"y":0.3941}},{"id":"field-2","type":"fieldBlock","label":"Campo 2","grid":{"rows":6,"cols":6},"polygon":[{"x":0.4378,"y":0.2762},{"x":0.6064,"y":0.2882},{"x":0.6968,"y":0.3913},{"x":0.4986,"y":0.4567},{"x":0.3515,"y":0.3683}],"workPoint":{"x":0.5276,"y":0.3729}},{"id":"field-3","type":"fieldBlock","label":"Campo 3","grid":{"rows":6,"cols":6},"polygon":[{"x":0.6112,"y":0.0994},{"x":0.8218,"y":0.1105},{"x":0.8923,"y":0.232},{"x":0.6961,"y":0.2523},{"x":0.5753,"y":0.1703}],"workPoint":{"x":0.7355,"y":0.174}},{"id":"field-4","type":"fieldBlock","label":"Campo 4","grid":{"rows":6,"cols":6},"polygon":[{"x":0.3232,"y":0.4678},{"x":0.4972,"y":0.4494},{"x":0.6229,"y":0.5691},{"x":0.4358,"y":0.6547},{"x":0.2182,"y":0.5516}],"workPoint":{"x":0.4323,"y":0.5488}},{"id":"field-5","type":"fieldBlock","label":"Campo 5","grid":{"rows":6,"cols":6},"polygon":[{"x":0.6706,"y":0.4328},{"x":0.8329,"y":0.3877},{"x":0.9917,"y":0.4954},{"x":0.8011,"y":0.6087},{"x":0.5787,"y":0.5295}],"workPoint":{"x":0.7873,"y":0.5046}},{"id":"field-6","type":"fieldBlock","label":"Campo 6","grid":{"rows":6,"cols":6},"polygon":[{"x":0.1395,"y":0.5691},{"x":0.3218,"y":0.651},{"x":0.2044,"y":0.8057},{"x":0.0173,"y":0.732},{"x":0.0331,"y":0.6308}],"workPoint":{"x":0.174,"y":0.6934}},{"id":"farmhouse","type":"buildingArea","label":"Casa","polygon":[{"x":0.205,"y":0.137},{"x":0.365,"y":0.145},{"x":0.389,"y":0.269},{"x":0.245,"y":0.286},{"x":0.154,"y":0.222}],"workPoint":{"x":0.285,"y":0.226}},{"id":"corral","type":"animalArea","label":"Curral","polygon":[{"x":0.615,"y":0.083},{"x":0.814,"y":0.095},{"x":0.893,"y":0.222},{"x":0.699,"y":0.257},{"x":0.571,"y":0.171}],"workPoint":{"x":0.738,"y":0.173}},{"id":"silos","type":"storageArea","label":"Silos","polygon":[{"x":0.853,"y":0.149},{"x":0.987,"y":0.174},{"x":0.997,"y":0.297},{"x":0.841,"y":0.309},{"x":0.789,"y":0.23}],"workPoint":{"x":0.91,"y":0.222}},{"id":"machinery","type":"machineryArea","label":"Maquinario","polygon":[{"x":0.819,"y":0.363},{"x":0.987,"y":0.378},{"x":0.99,"y":0.535},{"x":0.814,"y":0.589},{"x":0.728,"y":0.485}],"workPoint":{"x":0.888,"y":0.479}},{"id":"lake","type":"waterArea","label":"Lago","polygon":[{"x":0.626,"y":0.64},{"x":0.804,"y":0.577},{"x":1,"y":0.617},{"x":1,"y":0.927},{"x":0.751,"y":0.976},{"x":0.561,"y":0.825}],"workPoint":{"x":0.794,"y":0.773}},{"id":"shop","type":"marketArea","label":"Lojinha","polygon":[{"x":0.333,"y":0.736},{"x":0.444,"y":0.715},{"x":0.497,"y":0.807},{"x":0.383,"y":0.864},{"x":0.301,"y":0.808}],"workPoint":{"x":0.396,"y":0.785}},{"id":"road","type":"roadArea","label":"Estrada","polygon":[{"x":0.065,"y":0.828},{"x":0.154,"y":0.755},{"x":0.33,"y":1},{"x":0.204,"y":1}],"workPoint":{"x":0.168,"y":0.911}}];let areas=structuredClone(defaults),id=areas[0].id,hit=null,drag=false,showGrid=true;const c=document.getElementById("c"),ctx=c.getContext("2d"),sel=document.getElementById("sel"),out=document.getElementById("out"),status=document.getElementById("status");function ps(p){return{x:p.x*W,y:p.y*H}}function sp(x,y){return{x:+Math.max(0,Math.min(1,x/W)).toFixed(4),y:+Math.max(0,Math.min(1,y/H)).toFixed(4)}}function cur(){return areas.find(a=>a.id===id)}function init(){sel.innerHTML=areas.map(a=>"<option value=\""+a.id+"\">"+a.label+"</option>").join("");sel.value=id;draw()}function line(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function lerp(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}function drawGrid(pts){if(pts.length<4)return;const tl=pts[0],tr=pts[1],br=pts[2],bl=pts[pts.length-2];ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1;for(let i=1;i<6;i++){let t=i/6;line(lerp(tl,bl,t),lerp(tr,br,t));line(lerp(tl,tr,t),lerp(bl,br,t))}}function draw(){ctx.clearRect(0,0,W,H);areas.forEach(a=>{const active=a.id===id,pts=a.polygon.map(ps);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=active?"rgba(255,216,107,.22)":"rgba(97,214,255,.10)";ctx.strokeStyle=active?"#ffd86b":"rgba(97,214,255,.75)";ctx.lineWidth=active?3:1.5;ctx.fill();ctx.stroke();if(active&&showGrid&&a.grid)drawGrid(pts);pts.forEach((p,i)=>{ctx.beginPath();ctx.fillStyle="#65e2ff";ctx.arc(p.x,p.y,active?6:4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.fillText(String(i+1),p.x+7,p.y-7)});const w=ps(a.workPoint);ctx.beginPath();ctx.strokeStyle="#ff5b6e";ctx.lineWidth=3;ctx.arc(w.x,w.y,9,0,Math.PI*2);ctx.stroke();ctx.fillStyle="#101820dd";ctx.fillRect(w.x+10,w.y-24,120,34);ctx.fillStyle="#fff";ctx.fillText(a.label,w.x+16,w.y-10);ctx.fillText(a.type,w.x+16,w.y+5)});out.value=JSON.stringify(areas,null,2)}function nearest(x,y){const a=cur();let best=null;a.polygon.map(ps).forEach((p,i)=>{let d=Math.hypot(p.x-x,p.y-y);if(d<14&&(!best||d<best.d))best={kind:"v",i,d}});let w=ps(a.workPoint),d=Math.hypot(w.x-x,w.y-y);if(d<16&&(!best||d<best.d))best={kind:"w",d};return best}function xy(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}}function move(x,y){let a=cur(),p=sp(x,y);if(hit.kind==="w")a.workPoint=p;else a.polygon[hit.i]=p}c.onpointerdown=e=>{let p=xy(e);hit=nearest(p.x,p.y);if(e.shiftKey&&!hit){cur().polygon.push(sp(p.x,p.y));hit={kind:"v",i:cur().polygon.length-1}}drag=!!hit;if(drag)move(p.x,p.y);draw()};c.onpointermove=e=>{if(!drag)return;let p=xy(e);move(p.x,p.y);draw()};window.onpointerup=()=>drag=false;window.onkeydown=e=>{if(e.key==="Delete"&&hit&&hit.kind==="v"&&cur().polygon.length>3){cur().polygon.splice(hit.i,1);hit=null;draw()}};sel.onchange=()=>{id=sel.value;hit=null;draw()};document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(out.value);status.textContent="JSON copiado"};document.getElementById("reset").onclick=()=>{areas=structuredClone(defaults);hit=null;init()};document.getElementById("add").onclick=()=>{cur().polygon.push({x:.5,y:.5});draw()};document.getElementById("grid").onclick=()=>{showGrid=!showGrid;draw()};try{init()}catch(err){status.textContent="Erro no calibrador: "+err.message;console.error(err)}</script></body></html>
